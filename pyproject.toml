[project]
name = "enterprise-office-agent"
version = "0.1.0"
description = "A production-oriented Enterprise RAG engine with a deterministic Office Agent, local mock workflows, and optional bounded LLM assists."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-chroma",
    "langchain-text-splitters",
    "chromadb",
    "tavily-python",
    "beautifulsoup4",
    "python-dotenv",
    "pydantic",
]

# This is an application, not a library to be packaged/installed; tell uv not to build the project itself as a package.
[tool.uv]
package = false

# Dev / test-only dependencies, excluded from the runtime install.
# Install with `uv sync --group dev`.
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest",
    "pytest-cov",
    "ruff>=0.15.17",
]

# Let pytest import the graph package from the project root (pythonpath="."),
# and only collect tests under the tests directory.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (default scope)
    "F",               # pyflakes
    "W",               # pycodestyle warnings
    "I",               # isort (import sorting)
    "UP",              # pyupgrade (py311+ idioms)
    "B",               # flake8-bugbear
]
ignore = [
    "E501",  # long lines: prose-heavy comments; revisit later
]

[tool.ruff.lint.per-file-ignores]
"enterprise_rag/graph/graph.py" = ["E402"]      # imports after load_dotenv()
"evals/enterprise_rag/run_eval.py" = ["E402"]   # imports after sys.path insert
"tests/**" = ["E731"]                # monkeypatch lambdas are the house style

[tool.mypy]
python_version = "3.11"
files = [
    "enterprise_rag/cli.py",
    "enterprise_rag/graph/engine.py",
    "enterprise_rag/graph/config.py",
    "enterprise_rag/graph/formatting.py",
    "enterprise_rag/graph/state.py",
    "enterprise_rag/graph/consts.py",
    "enterprise_rag/graph/nodes/",
    "enterprise_rag/graph/chains/",
    "office_agent/",
]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# graph.py and ingestion.py stay out of the type-checked scope; when in-scope
# modules import them, follow the imports silently rather than reporting errors
# from those (still unchecked) files. The graph nodes and chains are now checked
# directly via the `files` list above, so they are intentionally NOT silenced.
[[tool.mypy.overrides]]
module = [
    "enterprise_rag.graph.graph",
    "enterprise_rag.ingestion",
]
follow_imports = "silent"

# tavily-python ships no py.typed; ignore its missing stubs where the
# web_search node imports TavilyClient directly.
[[tool.mypy.overrides]]
module = ["tavily.*"]
ignore_missing_imports = true
